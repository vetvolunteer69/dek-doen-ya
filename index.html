<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เด็กเดินยา สพอ. 69</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#10233A; --muted:#3F5670;
  --bg:#BFE0FF;
  --glass:rgba(255,255,255,.40); --glass-strong:rgba(255,255,255,.80); --glass-hi:rgba(255,255,255,.85);
  --glass-border:rgba(255,255,255,.72); --line:rgba(16,35,58,.10); --field:rgba(255,255,255,.55);
  --shadow:0 18px 50px rgba(30,90,170,.20);
  --sun:#FFC93C; --grass:#23955F; --sky:#2479CF; --coral:#E4445A; --warn:#8A5A00;
  --grass-soft:rgba(35,149,95,.16); --sky-soft:rgba(36,121,207,.14); --coral-soft:rgba(228,68,90,.14); --warn-soft:rgba(255,190,40,.30);
  --f1:#3E9BF5; --f2:#8FD0FF; --f3:#FFCF4A; --f4:#47C98A; --f5:#FF97A8; --bub:rgba(255,255,255,.9);
  --on-accent:#fff; --thumb:rgba(255,255,255,.95);
  --accent:var(--sky); --accent2:#2FB7C9; --accent-soft:var(--sky-soft);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#EEF5FD; --muted:#A9BCD0; --bg:#071225;
    --glass:rgba(22,40,66,.38); --glass-strong:rgba(18,32,54,.86); --glass-hi:rgba(255,255,255,.22);
    --glass-border:rgba(255,255,255,.16); --line:rgba(255,255,255,.09); --field:rgba(6,14,28,.42);
    --shadow:0 20px 55px rgba(0,0,0,.45);
    --sun:#FFD25E; --grass:#52D394; --sky:#6CB2F6; --coral:#FF8494; --warn:#FFD25E;
    --grass-soft:rgba(82,211,148,.16); --sky-soft:rgba(108,178,246,.16); --coral-soft:rgba(255,132,148,.16); --warn-soft:rgba(255,210,94,.16);
    --f1:#1D6FD6; --f2:#0F3C78; --f3:#B88718; --f4:#169062; --f5:#A3324F; --bub:rgba(180,220,255,.55);
    --on-accent:#071225; --thumb:rgba(255,255,255,.93); --accent2:#3FD0DE;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#EEF5FD; --muted:#A9BCD0; --bg:#071225;
  --glass:rgba(22,40,66,.38); --glass-strong:rgba(18,32,54,.86); --glass-hi:rgba(255,255,255,.22);
  --glass-border:rgba(255,255,255,.16); --line:rgba(255,255,255,.09); --field:rgba(6,14,28,.42);
  --shadow:0 20px 55px rgba(0,0,0,.45);
  --sun:#FFD25E; --grass:#52D394; --sky:#6CB2F6; --coral:#FF8494; --warn:#FFD25E;
  --grass-soft:rgba(82,211,148,.16); --sky-soft:rgba(108,178,246,.16); --coral-soft:rgba(255,132,148,.16); --warn-soft:rgba(255,210,94,.16);
  --f1:#1D6FD6; --f2:#0F3C78; --f3:#B88718; --f4:#169062; --f5:#A3324F; --bub:rgba(180,220,255,.55);
  --on-accent:#071225; --thumb:rgba(255,255,255,.93); --accent2:#3FD0DE;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;background:transparent;color:var(--ink);font-family:"IBM Plex Sans Thai",system-ui,sans-serif;font-size:16px;line-height:1.6}
body.large{--accent:var(--grass);--accent2:#8BD34A;--accent-soft:var(--grass-soft)}
body.large .bg{--f1x:var(--f4);--f4x:var(--f1)}

/* พื้นหลังคลื่นของเหลว */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:
  radial-gradient(120% 80% at 0% 0%,var(--f2) 0%,transparent 60%),
  radial-gradient(90% 70% at 100% 30%,color-mix(in srgb,var(--f1x,var(--f1)) 70%,transparent) 0%,transparent 65%),
  radial-gradient(90% 60% at 20% 100%,color-mix(in srgb,var(--f4x,var(--f4)) 65%,transparent) 0%,transparent 65%),
  var(--bg);
  --f1x:var(--f1);--f4x:var(--f4)}
.bg svg{position:absolute;inset:-10%;width:120%;height:120%}
.bg .wave{filter:blur(28px);opacity:.85}
.bg .sheen{opacity:.5;filter:blur(2px)}
.bubble{fill:url(#bubg)}
@media (prefers-reduced-motion:no-preference){
  .bg .drift{animation:drift 26s ease-in-out infinite alternate;transform-origin:50% 50%}
  @keyframes drift{to{transform:translate(-3%,2%) rotate(4deg) scale(1.05)}}
}

.glass{position:relative;background:linear-gradient(135deg,var(--glass-hi) -40%,var(--glass) 40%);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid var(--glass-border);box-shadow:var(--shadow),inset 1px 1px 0 rgba(255,255,255,.45),inset -1px -1px 0 rgba(255,255,255,.06)}

.wrap{max-width:900px;margin:0 auto;padding:18px 16px 48px}
h1,h2,h3,.num,.tab,.stat b{font-family:"Mitr","IBM Plex Sans Thai",sans-serif}
header.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:6px 0 16px;padding:14px 16px;border-radius:28px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.logo{flex:none;width:54px;height:54px;border-radius:18px;display:grid;place-items:center;font-size:28px;background:linear-gradient(135deg,var(--sun),var(--accent));box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 45%,transparent),inset 0 1px 0 rgba(255,255,255,.6)}
h1{font-size:clamp(24px,5.4vw,34px);line-height:1.15;margin:0;font-weight:600}
.lede{margin:2px 0 0;color:var(--muted);font-size:14px}

.theme{display:inline-flex;padding:4px;border-radius:999px;gap:2px;background:var(--field);border:1px solid var(--glass-border)}
.theme button{appearance:none;border:0;background:transparent;color:var(--ink);font:inherit;font-size:14px;padding:7px 12px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.theme button[aria-pressed="true"]{background:var(--glass-strong);box-shadow:0 4px 14px rgba(0,0,0,.14);font-weight:600}

.tabs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.tab{appearance:none;color:var(--ink);border-radius:24px;padding:14px 12px;font-size:20px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.tab .em{font-size:26px}
.tab[aria-selected="true"].t-small{background:linear-gradient(120deg,var(--sky),#2FB7C9);color:#fff;border-color:rgba(255,255,255,.5);box-shadow:0 14px 34px color-mix(in srgb,var(--sky) 50%,transparent),inset 0 1px 0 rgba(255,255,255,.5)}
.tab[aria-selected="true"].t-large{background:linear-gradient(120deg,var(--grass),#8BC34A);color:#fff;border-color:rgba(255,255,255,.5);box-shadow:0 14px 34px color-mix(in srgb,var(--grass) 50%,transparent),inset 0 1px 0 rgba(255,255,255,.5)}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

.patient{border-radius:30px;padding:20px;margin-bottom:14px}
.prow{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end}
.weight{flex:1 1 240px}
.weight label,.fld label{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
.wbox{display:flex;align-items:baseline;gap:8px;background:var(--field);border:1px solid var(--glass-border);border-radius:22px;padding:6px 18px;box-shadow:inset 0 2px 10px rgba(0,0,0,.06)}
.wbox input{font-family:"Mitr",sans-serif;font-size:52px;font-weight:600;width:100%;min-width:0;border:0;background:transparent;color:var(--ink);padding:0}
.wbox input:focus{outline:none}
.wbox:focus-within{outline:3px solid var(--sun);outline-offset:2px}
.wbox span{font-family:"Mitr";font-size:22px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:1px solid var(--glass-border);background:var(--field);color:var(--ink);border-radius:999px;padding:9px 16px;font:inherit;font-size:15px;cursor:pointer}
.chip[aria-pressed="true"]{background:linear-gradient(120deg,var(--accent),var(--accent2));border-color:rgba(255,255,255,.5);color:#fff;box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 40%,transparent)}
.chip.flag[aria-pressed="true"]{background:linear-gradient(120deg,var(--coral),#FF8A5B);box-shadow:0 8px 20px color-mix(in srgb,var(--coral) 40%,transparent)}
.fld input,.fld select,.opt select,.opt input{font:inherit;font-size:16px;border:1px solid var(--glass-border);background:var(--field);color:var(--ink);border-radius:14px;padding:8px 10px;width:100%}
.opt select option,.fld select option{background:var(--bg);color:var(--ink)}
.fld{flex:0 1 150px;min-width:0}
.subrow{margin-top:14px;display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.helper{margin-top:12px;font-size:14px}
.helper summary{cursor:pointer;color:var(--accent);font-weight:500}
.helper .hgrid{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-top:8px}
.helper .hgrid .fld{flex:1 1 120px}

/* แถบสรุป */
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-radius:26px;margin-bottom:24px;overflow:hidden}
.stat{display:flex;align-items:center;gap:12px;padding:14px 16px;border-left:1px solid var(--line)}
.stat:first-child{border-left:0}
.stat .ic{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.s-ok .ic{background:linear-gradient(135deg,var(--grass),#8BC34A)}
.s-warn .ic{background:linear-gradient(135deg,var(--sun),#FF9F43)}
.s-stop .ic{background:linear-gradient(135deg,var(--coral),#FF8A5B)}
.stat b{display:block;font-size:26px;font-weight:600;line-height:1}
.stat span{font-size:13px;color:var(--muted)}

.group{margin-bottom:24px}
.group h2{font-size:20px;font-weight:500;margin:0 0 10px 2px;display:flex;align-items:center;gap:10px}
.group h2 .ico{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:21px;background:var(--glass);border:1px solid var(--glass-border);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 30%,transparent),inset 1px 1px 0 rgba(255,255,255,.5)}
.list{border-radius:28px;overflow:hidden}
.drug{display:grid;grid-template-columns:78px 1fr auto;gap:6px 14px;padding:16px 18px;border-top:1px solid var(--line)}
.drug:first-child{border-top:0}
.thumb{width:78px;height:78px;border-radius:20px;background:var(--thumb);border:1px solid var(--glass-border);padding:5px;cursor:pointer;position:relative;display:grid;place-items:center;align-self:start;box-shadow:0 8px 20px rgba(0,0,0,.14);grid-template:100%/100%}
.thumb img{position:absolute;top:5px;left:5px;width:calc(100% - 10px);height:calc(100% - 10px);object-fit:contain;display:block}
.thumb .cnt{position:absolute;right:-6px;bottom:-6px;background:linear-gradient(120deg,var(--accent),var(--accent2));color:#fff;font-family:"Mitr";font-size:12px;line-height:1;border-radius:999px;padding:4px 7px;box-shadow:0 3px 8px rgba(0,0,0,.2)}
.thumb.none{background:var(--field);cursor:default;font-size:28px;opacity:.65;box-shadow:none}
.dname{font-family:"Mitr";font-size:18px;font-weight:500;line-height:1.3}
.dname small{font-family:"IBM Plex Sans Thai";font-weight:400;color:var(--muted);font-size:14px;margin-left:4px}
.meta{font-size:14px;color:var(--muted);margin-top:2px}
.res{display:flex;flex-direction:column;align-items:flex-end;gap:4px;align-self:start}
.dose{min-width:96px;text-align:center;border-radius:20px;padding:6px 14px 8px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--on-accent);box-shadow:0 10px 24px color-mix(in srgb,var(--accent) 40%,transparent),inset 0 1px 0 rgba(255,255,255,.45)}
.dose .dl{display:block;font-size:12px;line-height:1.2;opacity:.92;font-weight:500}
.dose .num{font-size:36px;font-weight:600;line-height:1.05;white-space:nowrap;letter-spacing:-.5px}
.dose .unit{font-size:16px;font-weight:500;margin-left:3px;opacity:.95;letter-spacing:0}
.dose.pending{background:transparent;color:var(--muted);box-shadow:none;border:2px dashed color-mix(in srgb,var(--muted) 45%,transparent)}
.dose.stop{background:var(--coral-soft);color:var(--coral);box-shadow:none;border:1px solid color-mix(in srgb,var(--coral) 35%,transparent)}
.dose.stop .num{text-decoration:line-through;text-decoration-thickness:3px}
.dose.range .num{font-size:28px}
.dose.na{background:var(--field);color:var(--muted);box-shadow:none;border:1px solid var(--line)}
.res .alt{font-size:12.5px;color:var(--muted);text-align:right;max-width:150px;line-height:1.35}
.notes{grid-column:2/-1;display:flex;flex-direction:column;gap:5px}
.badge{display:inline-flex;gap:6px;align-items:flex-start;font-size:14px;border-radius:12px;padding:5px 11px;line-height:1.45;border:1px solid rgba(255,255,255,.18)}
.b-ok{background:var(--grass-soft);color:var(--grass)}
.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-stop{background:var(--coral-soft);color:var(--coral)}
.b-info{background:var(--sky-soft);color:var(--ink)}
.opts{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:10px}
.opt{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.opt select,.opt input{width:auto;padding:5px 10px;font-size:14px;border-radius:12px}
.opt input{width:70px}

dialog#viewer{border:1px solid var(--glass-border);border-radius:30px;padding:18px;width:min(92vw,560px);max-height:92vh;background:var(--glass-strong);color:var(--ink);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);box-shadow:var(--shadow)}
dialog#viewer::backdrop{background:rgba(8,20,40,.42);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.vtop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.vtop h3{margin:0;font-size:19px;font-weight:500;line-height:1.3}
.vmain{background:var(--thumb);border-radius:20px;display:grid;place-items:center;height:min(56vh,420px);padding:10px}
.vmain img{width:100%;height:100%;min-height:0;object-fit:contain;display:block}
.vcap{font-family:"Mitr";margin:10px 0 8px;color:var(--muted)}
.vstrip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.vstrip button{width:62px;height:62px;flex:none;background:var(--thumb);border:2px solid var(--line);border-radius:14px;padding:3px;cursor:pointer}
.vstrip button[aria-current="true"]{border-color:var(--accent);border-width:3px}
.vstrip img{width:100%;height:100%;object-fit:contain;display:block}

.ref{border-radius:26px;padding:4px 18px;margin-bottom:22px}
.ref summary{cursor:pointer;font-family:"Mitr";font-size:18px;padding:12px 0}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px;margin-bottom:12px}
th,td{text-align:left;padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:14px}
.foot{font-size:14px;color:var(--muted);padding:12px 18px;border-radius:22px}
.foot::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--sun);margin-right:8px;box-shadow:0 0 10px var(--sun)}
[hidden]{display:none!important}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .glass,dialog#viewer{background:var(--glass-strong)}
}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.more{grid-column:2/-1}
.more summary{cursor:pointer;font-size:14px;color:var(--accent);font-weight:500;list-style:none;display:inline-flex;align-items:center;gap:6px;padding:6px 0;min-height:36px}
.more summary::-webkit-details-marker{display:none}
.more summary::before{content:"▸";transition:transform .2s}
.more[open] summary::before{transform:rotate(90deg)}
.more .notes{margin-top:2px}
.notes+.more{margin-top:-2px}
.quickwrap{position:fixed;left:0;right:0;bottom:0;padding:0 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:20}
.quick{pointer-events:auto;appearance:none;color:var(--ink);font:inherit;border-radius:999px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;max-width:100%}
.quick .qw{white-space:nowrap;font-family:"Mitr";font-size:20px;font-weight:600;color:var(--accent)}
.quick .qe{background:linear-gradient(120deg,var(--accent),var(--accent2));color:#fff;border-radius:999px;padding:6px 14px;font-size:14px;white-space:nowrap}
.quick .qs{font-size:14px;color:var(--muted);white-space:nowrap}
@media (max-width:560px){
  .wrap{padding:10px 12px 96px}
  .glass{-webkit-backdrop-filter:blur(14px) saturate(170%);backdrop-filter:blur(14px) saturate(170%)}
  header.top{flex-wrap:nowrap;padding:10px 10px 10px 12px;gap:8px;border-radius:24px;margin:4px 0 12px}
  .brand{gap:10px}
  .logo{width:40px;height:40px;font-size:21px;border-radius:13px}
  h1{font-size:20px;white-space:nowrap}
  .lede{font-size:12.5px;line-height:1.35}
  .brand{min-width:0}
  .theme{flex:none}
  .theme button{padding:0;width:36px;height:36px;justify-content:center}
  .theme button .tl{display:none}
  .tabs{gap:8px;margin-bottom:12px}
  .tab{font-size:17px;padding:10px 8px;border-radius:20px;white-space:nowrap;gap:6px;min-height:52px}
  .tab .em{font-size:20px;letter-spacing:-4px;margin-right:4px}
  .patient{padding:14px;border-radius:24px;margin-bottom:12px}
  .prow{gap:10px}
  .weight{flex-basis:100%}
  .wbox{padding:4px 14px;border-radius:18px}
  .wbox input{font-size:40px}
  .chips{gap:6px}
  .chip{padding:8px 14px;min-height:42px;font-size:15px}
  .subrow{gap:8px;margin-top:10px;align-items:flex-end}
  .subrow .fld{flex:1 1 110px}
  .fld input,.fld select,.opt select,.opt input{font-size:16px;min-height:42px}
  .helper .hgrid .fld{flex:1 1 130px}
  .stats{border-radius:20px;margin-bottom:18px}
  .stat{gap:8px;padding:10px 12px}
  .stat .ic{width:30px;height:30px;font-size:14px}
  .stat b{font-size:22px}
  .stat span{font-size:12px;line-height:1.3}
  .group{margin-bottom:18px}
  .group h2{font-size:18px;margin-bottom:8px}
  .group h2 .ico{width:36px;height:36px;font-size:18px}
  .list{border-radius:22px}
  .drug{grid-template-columns:56px minmax(0,1fr) auto;gap:4px 10px;padding:12px}
  .thumb{width:56px;height:56px;border-radius:15px;padding:3px}
  .thumb img{top:3px;left:3px;width:calc(100% - 6px);height:calc(100% - 6px)}
  .dname{font-size:16px}
  .dname small{display:block;margin:0;font-size:12.5px}
  .meta{font-size:13px;line-height:1.4}
  .dose{min-width:78px;padding:4px 10px 6px;border-radius:16px}
  .dose .dl{font-size:11px}
  .dose .num{font-size:28px}
  .dose.range .num{font-size:21px}
  .dose .unit{font-size:13px}
  .res .alt{font-size:11.5px;max-width:110px}
  .opts,.notes,.more{grid-column:1/-1}
  .opt{flex:1 1 100%}
  .opt select{flex:1;min-width:0;width:100%}
  .badge{font-size:13.5px;padding:5px 10px}
  .ref{padding:2px 14px;border-radius:20px}
  table{font-size:14px}
  .foot{font-size:13px;padding:10px 14px}
  dialog#viewer{width:100vw;max-width:100vw;margin:auto 0 0;border-radius:26px 26px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));max-height:88vh}
  .vmain{height:min(50vh,360px)}
}
@media (max-width:430px){
  .lede{display:none}
}
@media (max-width:400px){
  h1{font-size:17px}
  .logo{width:36px;height:36px;font-size:19px}
  .theme button{width:32px;height:32px;font-size:13px}
  .brand>div:last-child{min-width:0;overflow:hidden}
}
@media (max-width:360px){
  h1{font-size:15.5px}
}
@media (max-width:340px){
  .logo{display:none}

<div class="wrap">
  <header class="top glass">
    <div class="brand"><div class="logo" aria-hidden="true">💉</div><div>
      <h1>เด็กเดินยา สพอ. 69</h1>
      <p class="lede">ใส่น้ำหนักสัตว์ แล้วดูปริมาตรยาที่ต้องดูดได้ทันที</p>
    </div></div>
    <div class="theme" role="group" aria-label="โหมดสี">
      <button type="button" data-theme-set="light" aria-pressed="false"><span aria-hidden="true">☀️</span><span class="tl">สว่าง</span></button>
      <button type="button" data-theme-set="dark" aria-pressed="false"><span aria-hidden="true">🌙</span><span class="tl">มืด</span></button>
      <button type="button" data-theme-set="auto" aria-pressed="false" aria-label="ตามเครื่อง"><span aria-hidden="true">🌓</span><span class="tl">ตามเครื่อง</span></button>
    </div>
  </header>

  <div class="tabs" role="tablist" aria-label="ประเภทสัตว์">
    <button class="tab t-small glass" role="tab" id="tab-small" aria-selected="true" aria-controls="panel"><span class="em" aria-hidden="true">🐶🐱</span>สัตว์เล็ก</button>
    <button class="tab t-large glass" role="tab" id="tab-large" aria-selected="false" aria-controls="panel"><span class="em" aria-hidden="true">🐄🐃</span>สัตว์ใหญ่</button>
  </div>

      <div class="weight">
        <label for="w">น้ำหนัก</label>
        <div class="wbox"><input id="w" type="number" inputmode="decimal" min="0" step="0.1" placeholder="0"><span>kg</span></div>
      </div>
      <div class="chips" id="species" role="group" aria-label="ชนิดสัตว์"></div>
    </div>
    <div class="subrow" id="subrow"></div>
    <details class="helper" id="helper-small">
      <summary>ชั่งแบบเจ้าของอุ้ม (ไม่ต้องคิดลบเอง)</summary>
      <div class="hgrid">
        <div class="fld"><label for="h1">ครั้งที่ 1 เจ้าของ+สัตว์ (kg)</label><input id="h1" type="number" inputmode="decimal" step="0.1"></div>
        <div class="fld"><label for="h2">ครั้งที่ 2 เจ้าของ (kg)</label><input id="h2" type="number" inputmode="decimal" step="0.1"></div>
        <button class="chip" id="huse" type="button">ใช้น้ำหนักนี้</button>
      </div>
    </details>
  </section>


  <main id="panel" role="tabpanel" aria-labelledby="tab-small"></main>

  <details class="ref glass" id="ref"></details>

  <div class="quickwrap" id="quickwrap" hidden><button type="button" class="quick glass" id="quick" aria-label="แก้น้ำหนักสัตว์"><span class="qs" id="qs"></span><span class="qw" id="qw"></span><span class="qe">แก้น้ำหนัก</span></button></div>

  <p class="foot glass">เว็บนี้สร้างไว้เพื่อช่วยการคำนวณเท่านั้น ให้ยืนยันกับอาจารย์หรือพี่หมอประจำโมก่อนให้ยาทุกครั้ง</p>
</div>

const IMGKEY={cpml:'cpm',dexs:'dex',dexl:'dex',adrs:'adr',cpr:'adr',adrl:'adr',tolfs:'tolf',tolfl:'tolf'};
for(const k in IMG){ IMG[k]=IMG[k].map(u=>{ try{ const b=atob(u.split(',')[1]), a=new Uint8Array(b.length); for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i); return URL.createObjectURL(new Blob([a],{type:'image/webp'})); }catch(e){ return u; } }); }
function imgs(id){ const k=IMGKEY[id]||id; return IMG[k]?IMG[k].map((s,i)=>({s,c:(CAP[k]||[])[i]||''})):null; }
const S={
  mode:'small',
  small:{sp:'dog',w:'',preg:false,fever:false},
  large:{sp:'cattle',w:'',age:'',preg:false,lact:false},
  opt:{}
};
try{const m=localStorage.getItem('vdc-mode'); if(m==='large'||m==='small') S.mode=m;}catch(e){}

const $=s=>document.querySelector(s);
function f(n,d){ if(n==null||!isFinite(n)) return '–'; if(d==null) d = n>=100?0:(n>=10?1:2); return String(+n.toFixed(d)); }
function O(id,key,def){ const k=id+'.'+key; return S.opt[k]!=null?S.opt[k]:def; }

const ok=t=>({t:'ok',x:t}), warn=t=>({t:'warn',x:t}), stop=t=>({t:'stop',x:t}), info=t=>({t:'info',x:t});

const SMALL=[
 {g:'วัคซีน', id:'rabies', name:'วัคซีนพิษสุนัขบ้า', brand:'Rabies', route:'SC ปลายขา', basis:'1 ml/ตัว',
  calc(p){ const n=[];
    let st='ok';
    if(p.preg){st='stop';n.push(stop('ไม่ทำในสัตว์ท้อง (เสี่ยงแท้ง)'));}
    if(p.fever){st='stop';n.push(stop('มีไข้หรือป่วย งดฉีด ให้พัก 5–10 นาทีแล้ววัดไข้ใหม่'));}
    n.push(info(`ดูดยาด้วยเข็ม 21G (เขียว) ฉีดด้วย ${p.sp==='cat'?'24G (ม่วง)':'23G (ฟ้า)'} ใช้ไซริงค์ 3 ml ดูดให้หมดขวด ถ้าได้น้อยกว่า 0.8 ml ให้ดูดใหม่`));
    n.push(info('ลูกสัตว์เริ่มฉีด 3 เดือน กระตุ้นซ้ำ 2–4 สัปดาห์ แล้วกระตุ้นทุกปี'));
    return {v:1,unit:'ml',st,n};}},
 {g:'ถ่ายพยาธิ', id:'pyrl', name:'Pyrantel ชนิดน้ำ', brand:'หมาตัวเล็ก แมว', route:'PO ป้อนปาก', needW:true,
  basis:'≤2 kg ให้ 0.4 ml · >2 kg ให้ 5 mg/kg = BW × 0.2',
  calc(p){ const n=[];
    const v=p.w<=2?0.4:p.w*0.2;
    n.push(warn('เขย่าขวดก่อนรินยา'));
    let st='ok';
    if(p.preg){st='warn';n.push(warn('สัตว์ท้อง/ให้นมให้ได้ แต่ระวังเรื่องโดส'));}
    n.push(info('ไม่ใช้คู่กับ piperazine, levamisole, morantel · ไม่แนะนำในตัวที่ผอมมาก ทรุดโทรม'));
    return {v,unit:'ml',st,n};}},
 {g:'ถ่ายพยาธิ', id:'pyrt', name:'Pyrantel ชนิดเม็ด', brand:'สุนัข ≥10 kg', route:'PO', basis:'1 เม็ด / 10 kg', needW:true,
  calc(p){ const n=[];
    if(p.sp==='cat') return {v:null,unit:'',st:'na',n:[stop('ชนิดเม็ดใช้เฉพาะสุนัข แมวใช้ชนิดน้ำ')]};
    if(p.w<10) return {v:null,unit:'',st:'na',n:[stop('น้ำหนักต่ำกว่า 10 kg ให้ใช้ชนิดน้ำแทน')]};
    const t=p.w/10, r=Math.round(t*2)/2;
    n.push(info(`คำนวณได้ ${f(t)} เม็ด ปัดเป็นครึ่งเม็ดใกล้สุด`));
    n.push(info('ใส่ซอง เขียนชื่อสัตว์ ชื่อยา จำนวนเม็ด ให้เจ้าของไปป้อนที่บ้าน'));
    return {v:r,unit:'เม็ด',st:'ok',n,d:1};}},
 {g:'ยาฉุกเฉิน · แพ้วัคซีน', id:'cpm', name:'Chlorpheniramine', brand:'CPM 10 mg/ml', route:'IM',

/* ---------- render ---------- */
function patient(){ const s=S[S.mode]; const w=parseFloat(s.w);
  return Object.assign({},s,{w:isFinite(w)&&w>0?w:null, age:s.age===''||s.age==null?'':+s.age}); }

function renderPatient(){
  const sm=S.mode==='small', s=S[S.mode];
  document.body.classList.toggle('large',!sm);
  $('#tab-small').setAttribute('aria-selected',sm); $('#tab-large').setAttribute('aria-selected',!sm);
  $('#panel').setAttribute('aria-labelledby',sm?'tab-small':'tab-large');
  $('#w').value=s.w;
  const sp=sm?[['dog','🐶 สุนัข'],['cat','🐱 แมว']]:[['cattle','🐄 โค'],['buffalo','🐃 กระบือ']];
  $('#species').innerHTML=sp.map(([v,l])=>`<button type="button" class="chip" data-sp="${v}" aria-pressed="${s.sp===v}">${l}</button>`).join('');
  $('#helper-small').hidden=!sm;
  let h='';
  if(sm){
    h=`<button type="button" class="chip flag" data-flag="preg" aria-pressed="${s.preg}">ท้อง/ให้นมลูก</button>
       <button type="button" class="chip flag" data-flag="fever" aria-pressed="${s.fever}">มีไข้/ป่วย</button>`;
  }else{
    h=`<div class="fld"><label for="age">อายุ (เดือน)</label><input id="age" type="number" inputmode="numeric" min="0" step="1" value="${s.age}" placeholder="ไม่ทราบ"></div>
       <button type="button" class="chip flag" data-flag="preg" aria-pressed="${s.preg}">ท้อง</button>
       <button type="button" class="chip flag" data-flag="lact" aria-pressed="${s.lact}">ให้นม</button>`;
  }
  $('#subrow').innerHTML=h;
  const a=$('#age'); if(a) a.addEventListener('input',e=>{S.large.age=e.target.value;renderDrugs();});
}

function badge(b){ const ic={ok:'✓',warn:'⚠',stop:'✕',info:'•'}[b.t]; return `<span class="badge b-${b.t}"><span aria-hidden="true">${ic}</span><span>${b.x}</span></span>`; }

function optHtml(d){
  if(!d.opts) return '';
  return `<div class="opts">`+d.opts.map(o=>{
    const val=O(d.id,o.k,o.d), id=`o-${d.id}-${o.k}`;
    if(o.num) return `<label class="opt" for="${id}">${o.l}<input id="${id}" data-o="${d.id}.${o.k}" type="number" step="0.5" min="${o.min}" max="${o.max}" value="${val}"></label>`;
    return `<label class="opt" for="${id}">${o.l}<select id="${id}" data-o="${d.id}.${o.k}">${o.c.map(([v,l])=>`<option value="${v}"${v===val?' selected':''}>${l}</option>`).join('')}</select></label>`;
  }).join('')+`</div>`;
}

function thumbHtml(d){ const im=imgs(d.id);
  if(!im) return `<div class="thumb none" aria-hidden="true">💊</div>`;
  return `<button type="button" class="thumb" data-img="${d.id}" aria-label="ดูรูปขวด ${d.name}"><img src="${im[0].s}" alt="">${im.length>1?`<span class="cnt">+${im.length-1}</span>`:''}</button>`; }
let VIEW=null;
function showImg(i){ const im=VIEW.im; $('#vimg').src=im[i].s; $('#vimg').alt=im[i].c||VIEW.name; $('#vcap').textContent=im[i].c;
  $('#vstrip').querySelectorAll('button').forEach((b,j)=>b.setAttribute('aria-current',j===i)); }
function openViewer(id){ const d=(SMALL.concat(LARGE)).find(x=>x.id===id); const im=imgs(id); if(!d||!im) return;
  VIEW={im,name:d.name}; $('#vtitle').textContent=d.name;
  $('#vstrip').hidden=im.length<2;
  $('#vstrip').innerHTML=im.map((x,j)=>`<button type="button" data-j="${j}" aria-label="${x.c||('รูปที่ '+(j+1))}"><img src="${x.s}" alt=""></button>`).join('');
  showImg(0); $('#viewer').showModal(); }
const GICON={'วัคซีน':'💉','ถ่ายพยาธิ':'🪱','วิตามิน':'✨','ยาฉุกเฉิน · แพ้วัคซีน':'🚑','ลดไข้ · ลดอักเสบ':'🌡️'};
function notesHtml(n){ if(!n||!n.length) return '';
  const key=n.filter(b=>b.t!=='info'), more=n.filter(b=>b.t==='info'); let h='';
  if(key.length) h+=`<div class="notes">${key.map(badge).join('')}</div>`;
  if(more.length) h+=`<details class="more"${window.innerWidth>560?' open':''}><summary>วิธีใช้และรายละเอียด (${more.length})</summary><div class="notes">${more.map(badge).join('')}</div></details>`;
  return h; }
function renderDrugs(){
  const p=patient(), list=S.mode==='small'?SMALL:LARGE, groups={}, T={ok:0,warn:0,stop:0,none:0};
  list.forEach(d=>{(groups[d.g]=groups[d.g]||[]).push(d);});
  let html='';
  for(const g in groups){
    html+=`<section class="group"><h2><span class="ico" aria-hidden="true">${GICON[g]||'💊'}</span>${g}</h2><div class="list glass">`;
    groups[g].forEach(d=>{
      const basis=typeof d.basis==='function'?d.basis(p):d.basis;
      let r, resHtml;
      if(d.needW&&!p.w){
        r={st:'none',n:[]};
        resHtml=`<div class="res"><div class="dose pending"><span class="dl">รอน้ำหนัก</span><div class="num">–</div></div></div>`;
      }else{
        r=d.calc(p);
        const val=r.txt!=null?r.txt:r.v==null?'–':(r.v2!=null?`${f(r.v)}–${f(r.v2)}`:f(r.v,r.d));
        const cls=(r.st==='stop'?' stop':r.st==='na'?' na':'')+(r.v2!=null?' range':'');
        const lab=r.st==='stop'?'งด':r.st==='na'?'ไม่ใช้':'';
        resHtml=`<div class="res"><div class="dose${cls}">${lab?`<span class="dl">${lab}</span>`:''}<div class="num">${val}<span class="unit">${r.unit||''}</span></div></div>${r.alt&&!/stop|na/.test(cls)?`<div class="alt">${r.alt}</div>`:''}</div>`;
      }
      T[r.st==='na'?'stop':r.st]=(T[r.st==='na'?'stop':r.st]||0)+1;
      const route=(r&&r.route)||d.route;
      const stBadge=r.st==='stop'?'':r.st==='na'?'':'';
      html+=`<div class="drug${r.st==='stop'?' is-stop':''}${r.st==='na'?' is-na':''}">
        ${thumbHtml(d)}
        <div><div class="dname">${d.name}${d.brand?`<small>${d.brand}</small>`:''}</div>
        <div class="meta">${[route,basis].filter(Boolean).join(' · ')}</div></div>
        ${resHtml}
        ${optHtml(d)}
        ${notesHtml(r.n)}
      </div>`;
    });
    html+=`</div></section>`;
  }
  $('#panel').innerHTML=html;
}

   <tr><td>หายใจ</td><td>15–30 ครั้ง/นาที</td><td>20–30 ครั้ง/นาที</td></tr>
   <tr><td>CRT</td><td colspan="2">น้อยกว่า 2 วินาที</td></tr>
   <tr><td>เกณฑ์เฝ้าระวัง</td><td colspan="2">ไข้ &gt;103 °F พัก 5–10 นาทีแล้ววัดใหม่ · ต่ำกว่า 99 °F วิกฤต แจ้งอาจารย์ · HR &lt;60 หรือ &gt;150 ในสุนัข ผิดปกติ</td></tr>
  </table></div>`
  : `<summary>ค่าปกติ Vital sign โค กระบือ</summary><div class="tbl"><table>
   <tr><th>ค่า</th><th>ค่าปกติ</th></tr>
   <tr><td>อุณหภูมิ</td><td>100–102.5 °F (37.8–39.2 °C)</td></tr>
   <tr><td>ชีพจร</td><td>50–80 bpm (ลูกโค 100–120)</td></tr>
   <tr><td>หายใจ</td><td>10–30 ครั้ง/นาที</td></tr>
   <tr><td>การบีบตัวกระเพาะรูเมน</td><td>1–2 (ถึง 3) ครั้ง/นาที</td></tr>
   <tr><td>เยื่อเมือก</td><td>ชมพูถึงชมพูเข้ม</td></tr>
   <tr><td>CRT</td><td>น้อยกว่า 2 วินาที</td></tr>
   <tr><td>แพ้วัคซีน</td><td>SC แสดงอาการช้ากว่า IM (15 นาที–2 ชม.) · vital sign เปลี่ยนให้สงสัย anaphylaxis</td></tr>
  </table></div>`;
}

function render(){ renderPatient(); renderDrugs(); renderRef(); }

/* ---------- events ---------- */
function setMode(m){ S.mode=m; try{localStorage.setItem('vdc-mode',m);}catch(e){} render(); }
$('#tab-small').addEventListener('click',()=>setMode('small'));
$('#tab-large').addEventListener('click',()=>setMode('large'));
document.querySelector('.tabs').addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowLeft'){ const m=S.mode==='small'?'large':'small'; setMode(m); $('#tab-'+m).focus(); }
});
$('#w').addEventListener('input',e=>{S[S.mode].w=e.target.value;renderDrugs();});
$('#species').addEventListener('click',e=>{const b=e.target.closest('[data-sp]'); if(!b) return; S[S.mode].sp=b.dataset.sp; renderPatient(); renderDrugs();});
$('#subrow').addEventListener('click',e=>{const b=e.target.closest('[data-flag]'); if(!b) return; const k=b.dataset.flag; S[S.mode][k]=!S[S.mode][k]; b.setAttribute('aria-pressed',S[S.mode][k]); renderDrugs();});
$('#panel').addEventListener('change',e=>{const k=e.target.dataset.o; if(!k) return; S.opt[k]=e.target.value; const id=e.target.id; renderDrugs(); const el=document.getElementById(id); if(el) el.focus();});
$('#panel').addEventListener('click',e=>{const b=e.target.closest('[data-img]'); if(b) openViewer(b.dataset.img);});
$('#vstrip').addEventListener('click',e=>{const b=e.target.closest('[data-j]'); if(b) showImg(+b.dataset.j);});
$('#vclose').addEventListener('click',()=>$('#viewer').close());
$('#viewer').addEventListener('click',e=>{ if(e.target===e.currentTarget) $('#viewer').close(); });
$('#huse').addEventListener('click',()=>{
  const a=parseFloat($('#h1').value), b=parseFloat($('#h2').value);
  if(isFinite(a)&&isFinite(b)&&a>b){ S.small.w=String(+(a-b).toFixed(2)); $('#w').value=S.small.w; renderDrugs(); }
  else { $('#h1').focus(); }
});

function applyTheme(t){
  if(t==='light'||t==='dark') document.documentElement.setAttribute('data-theme',t); else { document.documentElement.removeAttribute('data-theme'); t='auto'; }
  document.querySelectorAll('[data-theme-set]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.themeSet===t));
  try{localStorage.setItem('vdc-theme',t);}catch(e){}
}
document.querySelector('.theme').addEventListener('click',e=>{const b=e.target.closest('[data-theme-set]'); if(b) applyTheme(b.dataset.themeSet);});
let T0='auto'; try{T0=localStorage.getItem('vdc-theme')||'auto';}catch(e){}
applyTheme(T0);

function updQuick(){ const s=S[S.mode]; const sp={dog:'🐶 สุนัข',cat:'🐱 แมว',cattle:'🐄 โค',buffalo:'🐃 กระบือ'}[s.sp];
  $('#qs').textContent=sp; const w=parseFloat(s.w); $('#qw').textContent=isFinite(w)&&w>0?`${w} kg`:'– kg'; }
let patientVisible=true;
if('IntersectionObserver' in window){
  new IntersectionObserver(es=>{ patientVisible=es[0].isIntersecting; $('#quickwrap').hidden=patientVisible; updQuick(); },{rootMargin:'-40px 0px 0px 0px'}).observe(document.querySelector('.patient'));
}
$('#quick').addEventListener('click',()=>{ document.querySelector('.patient').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'}); setTimeout(()=>$('#w').focus({preventScroll:true}),350); });
const _rd=renderDrugs; renderDrugs=function(){ _rd(); updQuick(); };
let lastWide=window.innerWidth>560;
addEventListener('resize',()=>{ const wide=window.innerWidth>560; if(wide!==lastWide){ lastWide=wide; renderDrugs(); } });

render();
})();
</script>
</body>
</html>
